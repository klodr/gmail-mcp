name: Lint YAML & Markdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: klodr/.github/.github/workflows/reusable-lint-yaml-md.yml@63627d28c0e716176f24f06f4d3cad6c1abf3648
    with:
      # markdownlint-cli2-action splits globs by newline (NOT space).
      # Pass each pattern on its own line; `#prefix` excludes.
      # The config's `ignores` array is only honored when invoked
      # without explicit globs, hence we re-list exclusions here.
      markdownlint-globs: |
        **/*.md
        #CHANGELOG.md
        #node_modules
        #coverage
        #dist
