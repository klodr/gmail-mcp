# Spell-checks every Markdown file under `**/*.md` with cspell using
# en-US only. en-GB is intentionally NOT loaded so British variants
# surface as misspellings. Pilot run for the klodr/* family — if this
# stays useful here over a few weeks, the same step will be lifted
# into the klodr/.github reusable lint workflow.
name: Spell check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spell:
    name: cspell (Markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run cspell
        run: npm run lint:spell
