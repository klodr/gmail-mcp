# Spell-checks every Markdown file under `**/*.md` with cspell using
# en-US only. en-GB is intentionally NOT loaded so British variants
# surface as misspellings. Pilot run for the klodr/* family — if this
# stays useful here over a few weeks, the same step will be lifted
# into the klodr/.github reusable lint workflow.
name: Spell check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spell:
    name: cspell (Markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run cspell
        run: npm run lint:spell
