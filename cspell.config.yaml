# cspell — Markdown-only spell check, US English.
#
# Scope: every .md file in the repo (README, CHANGELOG.md is excluded
# because release-please generates it from commit messages and adding
# every contributor name + commit ID to the dictionary would defeat
# the point).
#
# Locale: US English only. en-GB is NOT loaded — this catches mixed
# variants (e.g. "authorised" vs "authorized") which was the trigger
# for adding this lint in the first place (CR feedback on PR #198).
#
# When you add a real technical term the spell-checker doesn't know,
# put it in `words:` below. When you remove a code-related word that
# turned out to be a typo, fix the typo in the doc.

$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
language: en-US

files:
  - "**/*.md"

ignorePaths:
  - node_modules/**
  - dist/**
  - coverage/**
  - CHANGELOG.md
  - .github/CHANGELOG.md
  - "**/CHANGELOG.md"

# Bundled cspell dictionaries we want active. en-GB is intentionally
# absent so that British variants surface as misspellings.
dictionaries:
  - en_US
  - softwareTerms
  - typescript
  - node
  - npm
  - companies
  - misc

